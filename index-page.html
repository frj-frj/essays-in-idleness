---
layout: default
title: LEAFS - Index
---

<div class="home" style="text-align:center;">
  <h1 style="text-align:center; font-size:2.5em; margin:3em 0 2em; font-weight:600;">LEAFS</h1>
  
  <div style="text-align:center; margin:2em 0;">
    <p style="font-style:italic; margin:1em 0;">- index -</p>
  </div>
  
  <ul style="list-style:none; padding:0; margin:2em auto; max-width:500px; text-align:center;">
    {% for post in site.posts %}
      <li style="margin:2em 0;">
        <span style="font-size:2em; font-weight:600; display:block; margin-bottom:0.5em;">
          {{ forloop.index | to_roman }}
        </span>
        <small style="color:#666;">
          {{ post.date | date: "%d %B %Y" }}
        </small>
        <br>
        <a href="/index.html#fragment-{{ forloop.index }}" style="color:#222; font-size:0.9em; display:inline-block; margin-top:0.5em;">← Back to LEAFS</a>
      </li>
    {% endfor %}
  </ul>
</div>
