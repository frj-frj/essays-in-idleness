---
layout: default
title: folhas
---

<div class="home">
  <h1>folhas</h1>
  
  <div style="margin:2em 0;">
    <p style="font-style:italic; margin:1em 0;"><a href="/index-page.html" style="color:#222; text-decoration:none;">- índice -</a></p>
  </div>
  
  <!-- All fragments in continuous scroll -->
  {% for post in site.posts reversed %}
    <div id="fragment-{{ forloop.index }}" style="padding-top:3em;">
      <section class="fragment-marker">{{ forloop.index | to_roman }}</section>
      
      <section style="margin:1em 0 3em; line-height:1.6;">
        {{ post.content }}
      </section>
    </div>
  {% endfor %}
</div>
